<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>ENI Memory Inscription</title>
  </head>
  <body>
    <h1>ENI Memory</h1>
    <header>
      <nav>
        <ul>
          <li class="menu"><a href="index.html">Accueil</a></li>
          <li class="menu">
            <a href="inscription.html">S'inscrire</a>
          </li>
          <li class="menu">
            <a href="connecter.html">Se connecter</a>
          </li>
          <li class="menu"><a href="profil.html">Profil</a></li>
          <li class="menu"><a href="jeu.html">Jouer</a></li>
        </ul>
      </nav>
    </header>
    <fieldset>
      <h2 id="inscription">Inscrivez-vous.</h2>
      <form action="" method="post">
        <label for="nom">Nom d'utilisateur :</label>
        <div class="champ">
          <input
            type="text"
            id="nom"
            name="nom"
            autofocus
            required
            placeholder="3 caractères minimum"
            pattern="[A-Za-Z]{2,}"
            title="Saisissez votre nom (3caractères min.)" />
          <img id="iconeNom" src="ressources/error.svg" alt="" />
        </div>
        <p class="verif" id="verifNom">
          Choisissez un pseudo contenant au moins 3 caractères.
        </p>
        <br />
        <label for="email">Entrez votre email : </label>
        <div class="champ">
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Votre email"
            title="Saisissez votre adresse email" />
          <img ed="iconeEmail" src="ressources/error.svg" alt="" />
        </div>
        <p class="verif" id="verifEmail">Entrez une adresse mail valide.</p>
        <br />
        <label for="motdePasse">Mot de passe :</label>
        <div class="champ">
          <input
            type="password"
            id="motdePasse"
            name="motdePasse"
            required
            placeholder="Votre mot de passe"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}"
            title="Saisissez votre mot de passe de minimum 6 caractères comportant
          au moins un symbole et un chiffre" />
          <img id="iconeMdp" src="ressources/error.svg" alt="" />
        </div>
        <p id="texteMdp">
          Au moins un symbole, un chiffre, ainsi que 6 caractères minimum.
        </p>
        <label for="confMotdePasse">Confimez le mot de passe :</label>
        <div class="champ">
          <input
            type="password"
            id="confMotdePasse"
            name="confMotdePasse"
            required
            placeholder="Confirmez le mot de passe"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}"
            title="Saisissez votre mot de passe de minimum 6 caractères comportant
          au moins un symbole et un chiffre" />
          <img id="iconeMdpVerif" src="ressources/error.svg" alt="" />
        </div>
        <br />
        <div class="boutons">
          <input class="bouton" type="submit" value="Création du compte" />
          <input class="bouton" type="reset" value="Annuler" />
        </div>
      </form>
    </fieldset>
    <script src="scriptInscription.js"></script>
  </body>
</html>
