<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>ENI Memory conction</title>
  </head>
  <body>
    <h1>ENI Memory</h1>
    <header>
      <nav>
        <ul>
          <li class="menu"><a href="index.html">Accueil</a></li>
          <li class="menu">
            <a href="inscription.html">S'inscrire</a>
          </li>
          <li class="menu">
            <a href="connecter.html">Se connecter</a>
          </li>
          <li class="menu"><a href="profil.html">Profil</a></li>
          <li class="menu"><a href="jeu.html">Jouer</a></li>
        </ul>
      </nav>
    </header>
    <fieldset>
      <h2>Connectez-vous.</h2>
      <form action="" method="post">
        <label for="email">Entrez votre email : </label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="Votre email"
          title="Saisissez votre adresse email" />
        <br />
        <label for="motdePasse">Mot de passe :</label>
        <input
          type="password"
          id="motdePasse"
          name="motdePasse"
          required
          placeholder="Votre mot de passe"
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}"
          title="Saisissez votre mot de passe de minimum 6 caractères comportant
          au moins un symbole et un chiffre" />
        <div class="boutons">
          <input class="bouton" type="submit" value="Se connecter" />
          <input class="bouton" type="reset" value="Annuler" />
        </div>
      </form>
    </fieldset>
  </body>
</html>
